
seed: 42
device: "cuda"

project:
  name: "EvidenceGain-X"
  version: "0.1.0"
  description: "Counterfactual, Self-Verifying Next-Best Evidence Acquisition for Crop Disease Diagnosis"

dataset:
  name: "crop_disease_pilot"
  crop: "tomato"
  classes:
    - "early_blight"
    - "late_blight"
    - "septoria_leaf_spot"
    - "healthy"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  manifest_dir: "data/manifests"
  img_size: 224
  batch_size: 16
  num_workers: 0
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  split_by: "source_case"

classifier:
  backbone: "resnet18"
  pretrained: true
  freeze_backbone: false
  lr: 0.0003
  weight_decay: 0.0001
  epochs: 15
  top_k: 3
  temperature: 1.0

evidence:
  candidate_types:
    - "lesion_closeup"
    - "leaf_underside"
    - "stem_view"
    - "symptom_text"
    - "weather_context"
  max_budget: 3
  stopping_entropy_threshold: 0.35
  stopping_margin_threshold: 0.70

selector:
  type: "evidence_gain_x"
  weights:
    alpha_sep: 1.0
    beta_unc: 0.8
    gamma_diag: 1.2
    lambda_cost: 0.3
    mu_risk: 0.5
  hidden_dim: 128
  lr: 0.0005
  epochs: 20

reliability:
  blur_laplacian_threshold: 100.0
  brightness_min: 30.0
  brightness_max: 230.0
  relevance_threshold: 0.50

verification:
  contradiction_threshold: 0.40
  confidence_penalty_factor: 0.50

evaluation:
  metrics:
    - "accuracy"
    - "macro_f1"
    - "top_k_acc"
    - "ece"
    - "entropy_reduction"
    - "budget_efficiency"
    - "contradiction_rate"
    - "rejection_rate"
  output_dir: "results"
